<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2a44;--mute:#5b6478;--acc:#464c88;--line:#e3e6ef}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 4px;font-size:28px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:22px}
.card h2{margin:0;font-size:19px}

</style>
</head>

  <p><a href="privacy.html">Privacy Policy · سياسة الخصوصية</a></p>
